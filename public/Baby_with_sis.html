<h1>அக்காவின் கைகளில் குழந்தை!</h1>

<hr/>

<p><b><i>

    முதன்முறையாக எங்கள் குழந்தை அக்காவின் கைகளில் இருக்கிறாள்! தன் தங்கையைத் தூக்கிக்கொள்வதில் அவள் மிகுந்த மகிழ்ச்சியும் உற்சாகமும் அடைகிறாள். இது எங்கள் குடும்பத்திற்கு மிகவும் அருமையான தருணம்; இந்தப் புகைப்படத்தில் அதைப் பதிவு செய்ததில் நாங்கள் மகிழ்ச்சி அடைகிறோம்.
</i></b></p>
